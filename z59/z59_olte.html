<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            
            for (let i_olt = 0; i_olt <= 15; i_olt++) {

                let x_olt = i_olt + 15;
                let p2_olt = Math.sqrt(i_olt + 15);
                let p4_olt = Math.sqrt(p2_olt);

                document.write(`p_2(${x_olt}) = ${p2_olt.toFixed(2)} &nbsp &nbsp &nbsp p_4(${x_olt}) = ${p4_olt.toFixed(2)}<br>`)
            }
            
        </script>
    </body>
</html>
