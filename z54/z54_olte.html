<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let a_olt = 6;
            let b_olt = 21;

            for (let i_olt = 0; i_olt < b_olt; i_olt++) {
                document.write("*");
            }
            document.write("<br>");
            
            for (let i_olt = 0; i_olt < a_olt - 2; i_olt++) {
                document.write("*");
                for (let x_olt = 0; x_olt < b_olt - 2; x_olt++) {
                    document.write("&nbsp ");
                }
                document.write("*<br>");
            }

            for (let i_olt = 0; i_olt < b_olt; i_olt++) {
                document.write("*");
            }
        </script>
    </body>
</html>
