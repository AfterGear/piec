<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <div style="color:red; font-size: 50px;">
            <script>
                do {
                    var a_olt = parseFloat(prompt("bok a = "));
                    var b_olt = parseFloat(prompt("bok b = "));
                    var c_olt = parseFloat(prompt("bok c = "));
                    document.write("sprawdzam warunki dla trójkąta dla wczytanych danych<br>");
                }
                while (!((a_olt > 0) && (b_olt > 0) && (c_olt > 0) && (a_olt + b_olt > c_olt) && (a_olt + c_olt > b_olt) && (c_olt + b_olt > a_olt)));

                document.write("wyrok: trójkąt się zamyka oraz boki są dodatnie");
            </script>
        </div>
    </body>
</html>
