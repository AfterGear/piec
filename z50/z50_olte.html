<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <script>
            let suma_olt = 0;
            for (i_olt = 1; i_olt <= 1000000; i_olt++) {
                suma_olt += 1 / i_olt;
            }
            document.write(`<p>suma = ${suma_olt.toFixed(2)}</p>`);
        </script>
    </body>
</html>
